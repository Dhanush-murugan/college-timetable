
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .error-container {
            max-width: 500px;
        }

        .error-code {
            font-size: clamp(100px, 25vw, 180px);
            font-weight: bold;
            color: #38bdf8;
            line-height: 1;
            margin-bottom: 20px;
        }

        h2 {
            font-size: 28px;
            margin-bottom: 15px;
        }

        p {
            font-size: 16px;
            line-height: 1.7;
            color: #cbd5e1;
        }

        .error-line {
            width: 80px;
            height: 4px;
            background: #38bdf8;
            margin: 25px auto;
            border-radius: 10px;
        }

        .status {
            display: inline-block;
            margin-top: 25px;
            padding: 10px 18px;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #94a3b8;
            font-size: 13px;
        }
    </style>
</head>

<body>
    <div class="error-container">
        <div class="error-code">404</div>

        <h2>Page Not Found</h2>

        <div class="error-line"></div>

        <p>
            Sorry! This website is temporarily unavailable.
            Please try again later.
        </p>

        <div class="status">
            Error Code: 404 | Page Unavailable
        </div>
    </div>
</body>
</html>
